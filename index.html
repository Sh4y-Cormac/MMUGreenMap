<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMUGreenMap</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="MMUGreenMap-project">

    <!-- ================= LEFT PANEL ================= -->
    <div id="left-panel">

        <!-- Header (STAYS FIXED) -->
        <div id="left-panel-header">
            <h1 id="header-text">MMUGreenMap</h1>
            <button id="panel-down" onclick="headerDown()">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAYAAAByDd+U..." />
            </button>
        </div>

        <!-- 🔽 SCROLLABLE CONTENT STARTS HERE -->
        <div id="left-panel-content">

            <!-- ================= COMMENTS SECTION ================= -->
            <div id="comments-section">
                <h2>Anonymous Comments</h2>

                <textarea
                    id="comment"
                    placeholder="Write anonymously..."
                ></textarea>

                <button onclick="postComment()">Post</button>

                <ul id="comments"></ul>
            </div>

            <!-- ================= LANDMARK CONTROLS ================= -->
            <div id="rest-of-panel">
                <div id="content-above-buttons">
                    <p id="button-header">Landmarks:</p>

                    <div id="checkbox-area">
                        <input
                            type="checkbox"
                            id="btn-checkbox"
                            checked
                            onclick="toggleAllSelect(event.target)"
                        />
                        <label for="btn-checkbox">Select All</label>
                    </div>
                </div>

                <div id="button-area">
